# ============================================================
#  Configuración del panel de administración
#  Este archivo le dice al panel qué campos mostrar y dónde
#  guardar cada cosa. No hace falta tocarlo para usar el panel.
# ============================================================

backend:
  name: github
  repo: manoscreativasnancy-dot/manoscreativas
  branch: main

# Dónde se guardan las fotos que se suban desde el panel
media_folder: "img"
public_folder: "/img"

locale: "es"

collections:

  # ---------------- TEJIDOS ----------------
  - name: "tejidos"
    label: "Tejidos"
    files:
      - name: "lista"
        label: "Lista de tejidos"
        file: "contenido/tejidos.json"
        fields:
          - name: "prendas"
            label: "Prendas"
            label_singular: "Prenda"
            widget: "list"
            summary: "{{fields.nombre}} — {{fields.precio}}"
            fields:
              - { name: "nombre", label: "Nombre de la prenda", widget: "string" }
              - name: "categoria"
                label: "Categoría"
                widget: "select"
                options:
                  - { label: "Chaleco", value: "chaleco" }
                  - { label: "Chal", value: "chal" }
                  - { label: "Gorro", value: "gorro" }
                  - { label: "Bufanda", value: "bufanda" }
                  - { label: "Manta", value: "mantas" }
                  - { label: "Otro", value: "otro" }
              - { name: "material", label: "Material", widget: "string", default: "Lana de oveja natural" }
              - { name: "precio", label: "Precio (solo números)", widget: "number", value_type: "int" }
              - name: "estado"
                label: "Estado"
                widget: "select"
                default: "disponible"
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Vendido", value: "vendido" }
                  - { label: "Por encargo", value: "encargo" }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - { name: "imagen", label: "Foto", widget: "image", required: false, hint: "Si no tienes foto todavía, escribe: pendiente" }

  # ---------------- FERIAS ----------------
  - name: "ferias"
    label: "Ferias"
    files:
      - name: "lista"
        label: "Lista de ferias"
        file: "contenido/ferias.json"
        fields:
          - name: "ferias"
            label: "Ferias"
            label_singular: "Feria"
            widget: "list"
            summary: "{{fields.fecha}} — {{fields.nombre}}"
            fields:
              - { name: "fecha", label: "Fecha (texto libre)", widget: "string", hint: "Ej: 15 y 16 de noviembre 2026" }
              - { name: "mes", label: "Mes corto", widget: "string", hint: "Tres letras, ej: Nov" }
              - { name: "dia", label: "Día(s)", widget: "string", hint: "Ej: 15-16" }
              - { name: "nombre", label: "Nombre de la feria", widget: "string" }
              - { name: "lugar", label: "Lugar y ciudad", widget: "string" }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - { name: "futura", label: "¿Todavía no ocurre?", widget: "boolean", default: true }
              - { name: "imagen", label: "Foto", widget: "image", required: false, hint: "Si no tienes foto todavía, escribe: pendiente" }

  # ---------------- TEXTOS DEL SITIO ----------------
  - name: "textos"
    label: "Textos del sitio"
    files:
      - name: "general"
        label: "Datos y contacto"
        file: "contenido/datos.json"
        fields:
          - { name: "nombre", label: "Nombre del sitio", widget: "string" }
          - { name: "artesana", label: "Nombre de quien teje", widget: "string" }
          - { name: "whatsapp", label: "WhatsApp (56 + 9 + 8 dígitos)", widget: "string", hint: "Sin + ni espacios. Ej: 56982478189" }
          - { name: "instagram", label: "Instagram (sin @)", widget: "string", required: false }
          - { name: "correo", label: "Correo", widget: "string", required: false }
          - { name: "ciudad", label: "Ciudad", widget: "string" }

      - name: "portada"
        label: "Página de inicio"
        file: "contenido/portada.json"
        fields:
          - { name: "titulo", label: "Título grande", widget: "string" }
          - { name: "bajada", label: "Párrafo de bajada", widget: "text" }
          - { name: "bloque_titulo", label: "Título del segundo bloque", widget: "string" }
          - { name: "bloque_texto", label: "Texto del segundo bloque", widget: "text" }

      - name: "sobremi"
        label: "Sobre mí"
        file: "contenido/sobremi.json"
        fields:
          - { name: "titulo", label: "Título", widget: "string" }
          - name: "parrafos"
            label: "Párrafos"
            widget: "list"
            field: { name: "texto", label: "Párrafo", widget: "text" }
          - name: "valores"
            label: "Lista de características"
            widget: "list"
            field: { name: "texto", label: "Característica", widget: "string" }
          - { name: "foto", label: "Foto", widget: "image", required: false }

