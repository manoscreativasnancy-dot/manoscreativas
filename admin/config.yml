# ============================================================
#  Configuración del panel de administración
# ============================================================
#  El panel NO guarda en la carpeta contenido/. Edita
#  directamente los archivos de datos del sitio:
#
#     productos.js   -> las prendas
#     ferias.js      -> las ferias
#     textos.js      -> los textos de las páginas
#     config.js      -> WhatsApp, Instagram, ciudad
#
#  Así, lo que se publica aparece en el sitio al instante,
#  sin intermediarios ni archivos JSON que leer.
# ============================================================

backend:
  name: github
  repo: manoscreativasnancy-dot/manoscreativas
  branch: main

media_folder: "img"
public_folder: "img"

locale: "es"

collections:

  # ---------------- TEJIDOS ----------------
  - name: "productos"
    label: "Tejidos"
    files:
      - name: "lista"
        label: "Lista de tejidos"
        file: "productos.js"
        fields:
          - name: "body"
            label: "Tejidos"
            label_singular: "Tejido"
            widget: "list"
            summary: "{{fields.nombre}} — ${{fields.precio}}"
            fields:
              - { name: "nombre", label: "Nombre de la prenda", widget: "string" }
              - name: "categoria"
                label: "Categoría"
                widget: "select"
                options:
                  - { label: "Chaleco", value: "chaleco" }
                  - { label: "Chal", value: "chal" }
                  - { label: "Gorro", value: "gorro" }
                  - { label: "Bufanda", value: "bufanda" }
                  - { label: "Manta", value: "mantas" }
                  - { label: "Otro", value: "otro" }
              - { name: "material", label: "Material", widget: "string", default: "Lana de oveja natural" }
              - { name: "precio", label: "Precio (solo números)", widget: "number", value_type: "int" }
              - name: "estado"
                label: "Estado"
                widget: "select"
                default: "disponible"
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Vendido", value: "vendido" }
                  - { label: "Por encargo", value: "encargo" }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - name: "imagen"
                label: "Foto"
                widget: "image"
                required: false
                hint: "Si todavía no tienes foto, deja este campo vacío."

  # ---------------- FERIAS ----------------
  - name: "ferias"
    label: "Ferias"
    files:
      - name: "lista"
        label: "Lista de ferias"
        file: "ferias.js"
        fields:
          - name: "body"
            label: "Ferias"
            label_singular: "Feria"
            widget: "list"
            summary: "{{fields.fecha}} — {{fields.nombre}}"
            fields:
              - { name: "fecha", label: "Fecha (como se mostrará)", widget: "string",
                  hint: "Ej: 15 y 16 de noviembre 2026" }
              - { name: "mes", label: "Mes corto", widget: "string",
                  hint: "Tres letras. Ej: Nov" }
              - { name: "dia", label: "Día(s)", widget: "string",
                  hint: "Ej: 15-16" }
              - { name: "nombre", label: "Nombre de la feria", widget: "string" }
              - { name: "lugar", label: "Lugar y ciudad", widget: "string" }
              - { name: "descripcion", label: "Descripción", widget: "text", required: false }
              - { name: "futura", label: "¿Todavía no ocurre?", widget: "boolean", default: true }
              - name: "imagen"
                label: "Foto"
                widget: "image"
                required: false
                hint: "Si todavía no tienes foto, deja este campo vacío."

  # ---------------- TEXTOS DEL SITIO ----------------
  - name: "textos"
    label: "Textos del sitio"
    files:
      - name: "portada"
        label: "Página de inicio"
        file: "textos.js"
        fields:
          - { name: "body", label: "Textos", widget: "object", fields: [
              { name: "portada_titulo", label: "Título grande", widget: "string" },
              { name: "portada_bajada", label: "Párrafo de bajada", widget: "text" },
              { name: "portada_bloque_titulo", label: "Título del segundo bloque", widget: "string" },
              { name: "portada_bloque_texto", label: "Texto del segundo bloque", widget: "text" }
            ] }

      - name: "general"
        label: "Datos y contacto"
        file: "config.js"
        fields:
          - { name: "body", label: "Datos", widget: "object", fields: [
              { name: "nombre", label: "Nombre del sitio", widget: "string" },
              { name: "artesana", label: "Nombre de quien teje", widget: "string" },
              { name: "whatsapp", label: "WhatsApp (56 + 9 + 8 dígitos)", widget: "string",
                hint: "Sin + ni espacios. Ej: 56982478189" },
              { name: "instagram", label: "Instagram (sin @)", widget: "string", required: false },
              { name: "correo", label: "Correo", widget: "string", required: false },
              { name: "ciudad", label: "Ciudad", widget: "string" }
            ] }
